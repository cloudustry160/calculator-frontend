<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A front-end and back-end separated calculator powered by a Python standard-library API and SQLite."
    />
    <title>Calculator System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">Python Standard Library + SQLite</p>
          <h1>Calculator System</h1>
        </div>
        <div class="header-actions">
          <span class="backend-status">Backend calculation</span>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-pressed="false"
          >
            Light mode
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="calculator-panel" aria-labelledby="calculator-title">
          <h2 id="calculator-title" class="sr-only">Expression calculator</h2>

          <div class="mode-tabs" role="tablist" aria-label="Calculation mode">
            <button
              type="button"
              class="mode-tab is-active"
              data-mode="calculator"
              role="tab"
              aria-selected="true"
            >
              Calculate
            </button>
            <button
              type="button"
              class="mode-tab"
              data-mode="base"
              role="tab"
              aria-selected="false"
            >
              Base conversion
            </button>
          </div>

          <div class="mode-panel" data-mode-panel="calculator">
          <form id="calculator-form" novalidate>
            <label class="field-label" for="expression">Expression</label>
            <input
              id="expression"
              class="expression-input"
              name="expression"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              maxlength="200"
              placeholder="Example: (1+2)*3"
              aria-describedby="calculator-feedback"
            />

            <div class="result-row">
              <span class="result-label">Result</span>
              <output
                id="result"
                class="result-value"
                aria-live="polite"
                aria-atomic="true"
              >
                —
              </output>
            </div>

            <p
              id="calculator-feedback"
              class="feedback"
              role="status"
              aria-live="polite"
            ></p>

            <div class="keypad" role="group" aria-label="Calculator keypad">
              <button
                type="button"
                class="key key-function"
                data-action="clear"
                aria-label="Clear expression"
              >
                C
              </button>
              <button
                type="button"
                class="key"
                data-action="value"
                data-value="("
                aria-label="Left parenthesis"
              >
                (
              </button>
              <button
                type="button"
                class="key"
                data-action="value"
                data-value=")"
                aria-label="Right parenthesis"
              >
                )
              </button>
              <button
                type="button"
                class="key key-operator"
                data-action="value"
                data-value="/"
                aria-label="Divide"
              >
                ÷
              </button>

              <button
                type="button"
                class="key"
                data-action="value"
                data-value="7"
              >
                7
              </button>
              <button
                type="button"
                class="key"
                data-action="value"
                data-value="8"
              >
                8
              </button>
              <button
                type="button"
                class="key"
                data-action="value"
                data-value="9"
              >
                9
              </button>
              <button
                type="button"
                class="key key-operator"
                data-action="value"
                data-value="*"
                aria-label="Multiply"
              >
                ×
              </button>

              <button
                type="button"
                class="key"
                data-action="value"
                data-value="4"
              >
                4
              </button>
              <button
                type="button"
                class="key"
                data-action="value"
                data-value="5"
              >
                5
              </button>
              <button
                type="button"
                class="key"
                data-action="value"
                data-value="6"
              >
                6
              </button>
              <button
                type="button"
                class="key key-operator"
                data-action="value"
                data-value="-"
                aria-label="Subtract"
              >
                −
              </button>

              <button
                type="button"
                class="key"
                data-action="value"
                data-value="1"
              >
                1
              </button>
              <button
                type="button"
                class="key"
                data-action="value"
                data-value="2"
              >
                2
              </button>
              <button
                type="button"
                class="key"
                data-action="value"
                data-value="3"
              >
                3
              </button>
              <button
                type="button"
                class="key key-operator"
                data-action="value"
                data-value="+"
                aria-label="Add"
              >
                +
              </button>

              <button
                type="button"
                class="key key-function"
                data-action="backspace"
                aria-label="Backspace"
              >
                ⌫
              </button>
              <button
                type="button"
                class="key"
                data-action="value"
                data-value="0"
              >
                0
              </button>
              <button
                type="button"
                class="key"
                data-action="value"
                data-value="."
                aria-label="Decimal point"
              >
                .
              </button>
              <button type="submit" class="key key-equals" aria-label="Calculate">
                =
              </button>
            </div>
          </form>
          </div>

          <div class="mode-panel" data-mode-panel="base" hidden>
            <form id="base-conversion-form" novalidate>
              <label class="field-label" for="base-value">Value</label>
              <input
                id="base-value"
                class="text-input"
                type="text"
                autocomplete="off"
                maxlength="80"
                placeholder="Example: 255 or FF"
              />

              <div class="conversion-grid">
                <label class="field-stack">
                  <span class="field-label">From base</span>
                  <select id="from-base" class="select-input">
                    <option value="2">Base 2</option>
                    <option value="8">Base 8</option>
                    <option value="10" selected>Base 10</option>
                    <option value="16">Base 16</option>
                  </select>
                </label>
                <label class="field-stack">
                  <span class="field-label">To base</span>
                  <select id="to-base" class="select-input">
                    <option value="2">Base 2</option>
                    <option value="8">Base 8</option>
                    <option value="10">Base 10</option>
                    <option value="16" selected>Base 16</option>
                  </select>
                </label>
              </div>

              <div class="result-row compact-result">
                <span class="result-label">Converted result</span>
                <output id="base-result" class="result-value">-</output>
              </div>
              <p id="base-feedback" class="feedback" role="status"></p>
              <button class="primary-action" type="submit">Convert</button>
            </form>
          </div>

        </section>

        <section class="history-panel" aria-labelledby="history-title">
          <header class="history-header">
            <div>
              <p class="eyebrow">Database records</p>
              <h2 id="history-title">History</h2>
            </div>
            <span id="history-count" class="history-count">0 items</span>
          </header>

          <form id="history-search-form" class="history-toolbar" novalidate>
            <label class="history-search">
              <span class="sr-only">Search history</span>
              <input
                id="history-search"
                type="search"
                autocomplete="off"
                placeholder="Enter an expression or result"
              />
            </label>
            <button class="history-search-button" type="submit">Search</button>
          </form>

          <p
            id="history-status"
            class="history-status"
            role="status"
            aria-live="polite"
          >
            Loading history…
          </p>
          <ul id="history-list" class="history-list" aria-label="Calculation history"></ul>
          <div class="history-pagination">
            <button id="history-prev" type="button">Previous</button>
            <span id="history-page">Page 1 / 1</span>
            <button id="history-next" type="button">Next</button>
          </div>
        </section>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
